name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply Changesets
        run: npx changeset version || echo "No changesets to process"

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Version is empty, exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Extract "What's Changed"
        id: changelog
        run: |
          BODY=$(awk 'BEGIN{found=0} /^## /{ if(found==0){found=1; next} else exit } found==1{print}' CHANGELOG.md)

          BODY=$(printf "%s\n" "$BODY" | sed -E '
            /^[[:space:]]*#/d
            /^[[:space:]]*$/d
            s/^- +[0-9a-f]{7,}:[[:space:]]*-?[[:space:]]*/- /g
            s/^[[:space:]]*-\s*/- /g
          ' | awk '!seen[$0]++ {print}')

          if [ -z "$BODY" ]; then
            BODY="- No notable changes"
          fi

          BODY=$(printf "## What's Changed\n\n%s" "$BODY")

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          makeLatest: true
