name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Apply changesets (ignore if none)
      - name: Apply Changesets
        run: npx changeset version || echo "No changesets to process"

      # Get package version
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Version is empty, exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Commit changes and create annotated tag
      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --tags

      # Extract latest changelog section (without headers, only bullets)
      - name: Extract "What's Changed"
        id: changelog
        run: |
          BODY=$(awk '
            /^## /{i++; next}
            i==1 && NF {print}
          ' CHANGELOG.md)

          BODY=$(echo "$BODY" | awk '{if($0 ~ /^#/){next}else if($0 ~ /^[[:space:]]*$/){next}else{print "- "$0}}')

          if [ -z "$BODY" ]; then
            BODY="- No notable changes"
          fi

          # Prepend "What's Changed" title
          BODY="What's Changed\n\n$BODY"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release
          body: ${{ steps.changelog.outputs.body }}
          makeLatest: true
