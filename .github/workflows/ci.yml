name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply Changesets
        id: changesets
        run: npx changeset version

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ -z "$VERSION" ] && exit 1
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Extract What's Changed
        id: changelog
        run: |
          BODY=$(awk 'BEGIN{f=0} /^## /{if(f==0){f=1;next}else exit} f{print}' CHANGELOG.md)
          [ -z "$BODY" ] && BODY="- No notable changes"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed\n\n$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          makeLatest: true
