name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout repository with full history and token for pushing changes
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      # Setup Node.js environment with caching for faster installs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Install project dependencies using npm ci for clean, reproducible installs
      - name: Install dependencies
        run: npm ci

      # Apply changesets to update versions and changelog
      # This will update package.json version and CHANGELOG.md
      - name: Apply Changesets and Update Changelog
        run: |
          npx changeset version
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): update changelog [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Extract latest changelog changes
        id: get_latest_changelog
        run: |
          if git show HEAD:CHANGELOG.md >/dev/null 2>&1; then
            latest=$(git show HEAD:CHANGELOG.md | awk '/^## /{if(++count==1){p=1;next}else if(p && /^## /){exit} p}')
          else
            latest="No changelog changes detected"
          fi
          
          cat << EOF >> $GITHUB_OUTPUT
          latest<<EOF
          $latest
          EOF

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.get_latest_changelog.outputs.latest }}
