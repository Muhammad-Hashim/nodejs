name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run TypeScript compiler
      run: npm run build
      
    - name: Start server and test endpoints
      run: |
        npm run build &
        sleep 5
        # Test getignore endpoint
        curl -f http://localhost:4000/getignore || exit 1
        # Test changeset endpoint
        curl -f http://localhost:4000/changeset/read || exit 1
        # Test root endpoint
        curl -f http://localhost:4000/ || exit 1
        
  changeset:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create Changeset
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Changes detected, creating changeset..."
          echo '{"summary": "Automated changes from CI", "releases": [{"name": "nodejs", "type": "patch"}]}' > .changeset/auto-$(date +%s).md
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .changeset/auto-*.md
          git commit -m "ci: add automated changeset" || true
        fi
        
    - name: Version and Publish
      run: |
        npx changeset version
        npx changeset publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      
    - name: Run dependency check
      run: npx audit-ci --moderate
