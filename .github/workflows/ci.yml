name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - run: npm ci

      # 4. Apply changesets (ignore if none)
      - name: Apply Changesets
        run: npx changeset version || echo "No changesets to process"

      # 5. Get current version from package.json
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Version is empty, exiting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 6. Commit changes and create annotated tag
      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --tags

      # 7. Extract latest changelog and format "What's Changed"
      - name: Extract "What's Changed"
        id: changelog
        run: |
          # Capture lines after the first "## " heading until the next "## " (or EOF)
          BODY=$(awk 'BEGIN{found=0} /^## /{ if(found==0){found=1; next} else exit } found==1{print}' CHANGELOG.md)

          # Normalize:
          # - remove headers and blank lines
          # - remove commit-hash prefixes like "- 19ff62d: - " or "- 19ff62d: "
          # - collapse duplicate leading "- -" into single "- "
          # - prefix non-bulleted/indented lines with "- "
          # - remove exact duplicate lines while preserving order
          BODY=$(printf "%s\n" "$BODY" | sed -E '
            /^[[:space:]]*#/d
            /^[[:space:]]*$/d
            s/^- +[0-9a-f]{7,}:[[:space:]]*-?[[:space:]]*/- /g
            s/^- +-+/ - /g
            /^[^-]/ s/^[[:space:]]*/- /
          ' | awk '!seen[$0]++ {print}')

          # Fallback if empty
          if [ -z "$BODY" ]; then
            BODY="- No notable changes"
          fi

          BODY=$(printf "## What's Changed\n\n%s" "$BODY")

          # Emit multiline output for use by later steps
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 8. Create GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          makeLatest: true
