name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply changesets
        run: npx changeset version

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore(release): update versions"
          git push origin main

      - name: Extract "What's Changed"
        id: changelog
        run: |
          BODY=$(awk '
            /^## /{i++; next}
            i==1 && NF {print}
          ' CHANGELOG.md)

          # Add bullet points only to content lines (ignore headers)
          BODY=$(echo "$BODY" | awk '{if($0 ~ /^#/){print}else if($0 ~ /^[[:space:]]*$/){next}else{print "- "$0}}')

          if [ -z "$BODY" ]; then
            BODY="- No notable changes"
          fi

          # Prepend a brief title
          BODY="What's Changed\n\n$BODY"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v$(node -p "require('./package.json').version")
          name: Release
          body: ${{ steps.changelog.outputs.body }}
          makeLatest: true
